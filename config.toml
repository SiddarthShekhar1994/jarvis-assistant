# Jarvis Assistant settings
#
# Every key is optional: delete a line to go back to its built-in default.
# A bad value never stops the app; it is replaced by the default and a warning
# is written to %LOCALAPPDATA%\briefing-reader\logs\briefing-reader.log.
#
# The Notion token and page id do NOT go here. Put NOTION_TOKEN and
# BRIEFING_PAGE_ID (both required) in the .env file next to this one.

[voice]
# Online voice used by edge-tts. To list every available voice, run:
#   py -3.13 -m edge_tts --list-voices
voice = "en-GB-RyanNeural"
# Speaking speed relative to normal, from "-50%" to "+100%".
# Examples: "+15%" is faster, "-10%" is slower.
rate = "+0%"
# Loudness relative to normal, from "-100%" to "+100%" (e.g. "-20%" is quieter).
volume = "+0%"
# Offline fallback (Windows built-in voices), used when edge-tts cannot be
# reached. Any part of the voice name, e.g. "Zira" or "David".
# Leave empty for the Windows default voice.
offline_voice = ""
# Silence between sections, in milliseconds (0 to 10000).
section_gap_ms = 600
# Silence where the page has a divider line, in milliseconds (0 to 10000).
divider_pause_ms = 900

[prompt]
# Delays for the "Later" buttons, in minutes (1 to 1440).
later_short_minutes = 10
later_long_minutes = 30
# If the prompt is not answered within this many seconds (10 to 3600),
# it counts as the short Later.
ignore_after_seconds = 120
# true: when the prompt comes back after Later it also takes keyboard focus.
# false: it appears on top but does not steal focus from what you are typing.
refocus_on_reprompt = false

[polling]
# With --run am / --run pm the app waits for the new briefing: it checks the
# page every interval_seconds (10 to 3600) ...
interval_seconds = 60
# ... for at most timeout_minutes (1 to 720), then reads whatever is there
# with a spoken note that it may be stale.
timeout_minutes = 15

[sections]
# Sections under these headings are skipped unless you click "Read everything".
# Matching ignores case and a trailing count, and also catches headings that
# start with the name, e.g. "Ignore (14)" or "Ignored".
ignore = ["Ignore"]

[sections.announce]
# How each section heading is announced:  "Heading on the page" = "What to say"
# Matching ignores case and a trailing count such as "(3)". Headings that are
# not listed are announced as written.
"Work inbox" = "Work inbox"
"Due" = "Due"
"Actionable" = "Actionable"
"Newsletters" = "Newsletters"

[notion]
# Notion API version sent with every request. Leave this unless you know you
# need a different one.
version = "2022-06-28"

[calendar]
# Calendar actions: the briefing can propose calendar invites, which appear
# under NEEDS YOUR OK. Approve adds one to Google Calendar; nothing is ever
# created without your Approve. false: proposals are still shown, but Approve
# never contacts Google.
enabled = true
# The OAuth client file downloaded from Google Cloud (README step 8). A path
# relative to this folder, or an absolute path. Keep the file private.
client_secret = "google_client_secret.json"
# The calendar new events go to. "primary" is your main calendar; another
# calendar's id is in Google Calendar under its Settings > Integrate calendar.
calendar_id = "primary"

[actions]
# The heading the briefing writes its proposals under. Matching ignores case
# and a trailing count. One name, or a list such as ["Proposed actions", "Actions"].
heading = "Proposed actions"
# Extra web hosts a card's Open button may open, besides the built-in Google
# (mail, docs, drive, calendar, meet), Slack (*.slack.com) and Canvas
# (*.instructure.com) hosts. An exact name, or "*.example.edu" for every
# subdomain. https only.
link_hosts = []
# Seconds a Send or Cancel event is held before it goes to Google (3 to 30).
# The card shows "Sent" / "Cancelled" with Undo at once, with no number; Undo
# during the hold sends nothing. Approve, Add block, Accept / Decline / Maybe
# and Move act at once; their Undo reverses the change for 10 minutes.
undo_seconds = 5
# Email recipients in these domains do not get the red NEW RECIPIENT badge,
# e.g. ["example.edu"] (its subdomains count too), except an Ask recipient you
# did not type yourself. Any other address must be one you emailed through
# Jarvis before; otherwise Send asks you to confirm it in Edit first. The
# sending account's own address is never sent to.
trusted_domains = []

# The Google accounts Jarvis may act for, one [accounts.<name>] table each. The
# name is what the briefing writes as acct= ("work", "personal"). Which Google
# account a name is never goes here: you pick it in Google's own sign-in when
# you click Sign in on a card of that account (the sign-ins are kept in
# %LOCALAPPDATA%\briefing-reader). Calendar proposals and to-do blocks always
# use the personal account. backend: the service that carries out the
# account's actions; only "google" works in this version. features: what Jarvis
# may do for the account; "calendar" answers invitations and moves or cancels
# events you organize; "gmail_send" sends the replies and emails you approve
# (send only); "gmail_read" lets Ask Jarvis read the Gmail threads a request is
# about (read only: never used to send, and nothing it reads is saved or
# logged; it is only used while [ask] is enabled, but the account's sign-in
# asks Google for it whether Ask is on or off: remove "gmail_read" from both
# accounts if you do not use Ask). With [productivity] on, "gmail_read" also
# covers the follow-up list's header scan (while Jarvis is on screen, every 30
# minutes, sender / recipients / subject / date only, the last 14 days, never
# the text), meeting prep reads (after your click: at most one thread per
# guest, 3 in all, last 14 days) and nudge drafts (after your click: that one
# thread). Adding a feature means one
# new Google sign-in for that account, which asks for all of them; if you
# untick reading email, the rest still works. If its administrator blocks the
# sign-in (admin_policy_enforced), remove "gmail_read" first, then
# "gmail_send", from that account.
[accounts.personal]
backend = "google"
features = ["calendar", "gmail_send", "gmail_read"]

[accounts.work]
backend = "google"
features = ["calendar", "gmail_send", "gmail_read"]

[schedule]
# When the "Briefing AM" and "Briefing PM" tasks run (24-hour HH:MM).
# install-schedule.ps1 uses these unless you pass -AmTime / -PmTime, and the
# app uses them to know which briefing an answer belongs to (and whether the
# catch-up at logon or unlock should ask about a missed one). The values below
# are only examples: set them a few minutes after your own briefing task writes
# the page. After changing them, run install-schedule.ps1 again.
am = "10:12"
pm = "23:42"

[hotkey]
# A global hotkey that opens Jarvis: it brings the running app forward, or
# starts it, with a greeting; nothing is read until you press Play. Rerun
# install-schedule.ps1 after a change. false: install-schedule.ps1 removes
# the "Briefing hotkey" task.
enabled = true
# ctrl, alt, shift, win plus one letter, digit, space or F1..F24, e.g.
# "ctrl+alt+j" or "ctrl+shift+F9". A letter, digit or space needs ctrl, alt or win.
combo = "ctrl+alt+j"

[agenda]
# The TODAY panel shows tomorrow from this hour on (0 to 24; 24 = never).
evening_from_hour = 18
# DEADLINES looks this many days ahead (1 to 60).
deadline_days = 14
# The Google calendars listed in TODAY ("primary" is your main calendar).
calendars = ["primary"]
# Calendar events whose title contains one of these words count as deadlines.
deadline_keywords = ["due", "deadline", "exam", "midterm", "final", "quiz", "submit", "submission", "assignment", "lab report", "application"]

[display]
# The header clock and the times in TODAY, ACTIVITY, STATUS and SECTIONS: "12h"
# shows 1:05 PM, "24h" shows 13:05. Sentences ("Updated today at 10:04 AM"),
# the cards, DEADLINES and the spoken briefing always use 12-hour times.
clock = "12h"

[ui]
# How much the screen moves. "lively" (the default): changing screens sweeps a
# scan line over the stage while the new screen's panels assemble, and when
# Jarvis first opens (or comes back after more than 30 minutes hidden) the orb's
# rings assemble from the centre out and the J.A.R.V.I.S. name types in.
# "calm": slower and fewer effects (gentle fades only). "off": no entrance or
# transition effects. With "Show animations in Windows" turned off (Settings >
# Accessibility > Visual effects) Jarvis treats this as "off" whatever it says.
# None of it ever delays Jarvis's greeting or what you click or type.
motion = "lively"

[ask]
# Ask Jarvis: type a request ("move my project sync to Friday and tell Ana")
# and Jarvis lines up cards under NEEDS YOUR OK; nothing happens until you
# click one (a Send or Cancel event also waits out its short Undo hold). The
# planner is your own Claude Code, signed in with your claude.ai plan (claude
# auth login --claudeai); Jarvis never uses an API key and refuses to run on any other sign-in. Off
# until you set true; check with: py -3.13 -m briefing_reader --ask-check
# In the app the bar sits on the reading screen; py -3.13 -m briefing_reader
# --ask opens it without playing the briefing.
enabled = false
# "sonnet"; "haiku" uses less of your plan.
model = "sonnet"
# One planner run may take this many seconds (30 to 300) ...
timeout_seconds = 90
# ... and this many turns (1 to 8).
max_turns = 4
# Planner runs allowed per hour (1 to 120) and per day (1 to 500). An Ask that
# reads mail is two runs. Counted in %LOCALAPPDATA%\briefing-reader.
max_per_hour = 20
max_per_day = 60
# The calendar Ask sees: from this many days back (0 to 7) to this many days
# ahead (1 to 60), on these calendars of each account.
days_back = 1
days_ahead = 14
calendars = ["primary"]
# At most this many proposals per Ask (1 to 8).
max_cards = 8
# Run Claude Code with --safe-mode --restricted when it has them.
hardened_flags = true
# Read the Gmail threads a request is about, on accounts with "gmail_read"
# (read only; the text is used for that one Ask and never saved or logged).
read_mail = true

[research]
# Web research (part of Ask Jarvis; needs [ask] enabled = true). Start a request
# with "web:" or let the Ask planner hand it over: a separate run of your Claude
# Code whose only tools are web search and web fetch. It gets only your words
# and today's date and time zone - never your calendar, mail, contacts,
# briefing or addresses - and only proposes cards (sources to open, a to-do,
# a new event) that wait for your OK. See the README before turning it on.
enabled = true
# The Ask planner may hand a request to web research (false: only "web:").
planner_may_ask = true
# "sonnet"; "haiku" uses less of your plan.
model = "sonnet"
# One research run may take this many seconds (30 to 300), make at most this
# many web searches (1 to 8) and read at most this many pages (0 to 8; 0 =
# search only). Jarvis stops a run that wants more.
timeout_seconds = 120
max_searches = 4
max_fetches = 4
# Research runs per hour (1 to 30) and per day (1 to 100). Each one also counts
# as an Ask planner run ([ask] max_per_hour, max_per_day).
max_per_hour = 6
max_per_day = 20
# At most this many sources become Open cards (1 to 6).
max_sources = 5

[assistant]
# Jarvis speaks on his own: a greeting when you open him, "your briefing is
# ready to view", his answers to Ask and what happened after you approved a
# card. false: he never speaks on his own (the briefing still plays when you
# press Play) and the header has no speaker button.
speak = true
# How Jarvis addresses you, in his sentences and in Ask's answers. Letters,
# spaces, . ' - (at most 20 characters); "" for no form of address.
address = "sir"
# A short, random, time-of-day greeting each time you open Jarvis (Start
# menu, the hotkey, --open).
greet = true
# The greeting may add one short fact that is safe to say aloud: how many
# proposals wait for your OK, or your next event within 3 hours. Never email.
greeting_context = true
# Speak Ask's answers (and a short "One moment, sir" while it plans).
speak_replies = true
# Speak what happened after an approved card was carried out ("Done, sir - ...").
speak_results = true
# true: the scheduled runs and the catch-up show the classic "Hear it now?"
# prompt instead of announcing the briefing.
scheduled_prompt = false

[live]
# The LIVE tab: every step Jarvis takes for an Ask or a card you approved, as it
# happens - what he read, the exact text he gave the planner, what he will send.
# On screen only: never saved, never logged; Clear empties it.
enabled = true
# When Jarvis starts working on an Ask or an approved card: "tab" brings up the
# LIVE tab (not while the briefing plays on BRIEFING; in a window too small to
# show the steps, the pop-out on your other screen when there is one), "window"
# shows the LIVE pop-out window without taking the focus, "off" never switches.
auto_open = "tab"
# Also show the reads Jarvis does on his own (agenda, event checks, sign-ins,
# Claude Code checks) in one compact row.
background = true
# Show the text Jarvis read and sent (email threads, the planner's input and
# reply, the outgoing message). false: only their sizes (also of the message
# text in the planner's proposals); subjects, names and addresses still show.
# false also takes no page pictures and leaves the email texts out of the
# pictures (their headers still show).
text = true
# Pictures in LIVE: an email Jarvis read or will send drawn as an email, a
# calendar change drawn on its day (before and after), an Ask's calendar read
# as a 7-day strip, and each web search of a research drawn as its results
# page. Drawn by Jarvis on this PC from the text he already has: no email HTML,
# no images from the web, no page opened for them.
pictures = true
# Page pictures of web research: each page a research read, and each page its
# answer cites that a search listed, is opened (again, for a page it read) on
# this PC in a private window (no sign-ins, nothing saved) and its first screen
# shown. That is an ordinary page visit from this PC: the site sees your IP
# address, also a cited site the research never read, which would not have
# seen it otherwise. false: no page is opened; the research works the same.
page_snapshots = true

[productivity]
# Plan my day, meeting prep, follow-ups and memory. Needs [ask] enabled (and, for mail,
# [ask] read_mail plus "gmail_read" on the account). Offers never act: nothing is read from
# your mail and no Claude request runs until you click. Off here; turn it on for this PC with
# JARVIS_PRODUCTIVITY_ENABLED=true in .env.
enabled = false
memory = true                 # the MEMORY tab, "remember that ...", notes given to the planner
memory_suggestions = true     # Jarvis may suggest a note; kept only when you click
max_memory = 100              # notes kept (10..200)
plan_offer = true             # "Shall I plan your day, sir?" after the AM briefing
plan_offer_until = "13:30"    # no plan offer after this time
day_start = "08:00"           # plan blocks only between these times
day_end = "22:00"
plan_max_blocks = 5           # 1..8
plan_min_free_minutes = 60    # 30..240: an offer, and a plan for today, need this much free time
prep_offers = true            # offer a brief before a meeting with guests
prep_lead_minutes = 15        # 5..60
prep_offers_per_day = 8       # 0..20
prep_max_offer_guests = 8     # offers only for meetings with 1..N other guests (1..50; typed prep: any)
prep_max_guests = 5           # guests whose latest thread is searched (1..10)
prep_lookback_days = 14       # 3..14: a prep search looks back this many days (never past the 14-day window)
prep_other_accounts = false   # also search your other accounts for a guest with no thread on the meeting's
prep_skip_words = ["focus", "lunch", "commute", "gym", "break", "hold", "ooo", "out of office"]
prep_speak_minimized = true   # say a prep offer (time only) while Jarvis is minimized
minimized_check = true        # while minimized: one read of that hour of your calendar before a prep offer
followups = true              # list follow-ups from the last days' mail headers (never the text)
scan_days = 14                # 3..14
scan_every_minutes = 30       # 15..240, only while the reading screen is visible
scan_max_threads = 150        # per account and scan (20..300)
waiting_after_hours = 20      # 1..72
owed_after_days = 3           # 1..13
followups_shown = 6           # rows per kind before "+N more" (1..20)
quiet_from = "22:00"          # no spoken offers from ...
quiet_until = "08:00"         # ... until (offers still appear as text)
max_runs_per_day = 20         # plans, briefs and drafts (each is also an Ask run), 1..60
reserve_ask_runs = 3          # Ask runs kept free each hour for your own requests, 0..10

[meetings]
# Meeting recording. Jarvis records a meeting on this PC ONLY when you click Start on the start card,
# after you tick "Everyone in this meeting has agreed to be recorded" (every meeting; never remembered).
# While it records, a red REC with the time shows in the header on every screen and in a small pill
# that stays on top, also when Jarvis is minimised. The microphone is kept as "You" and the call audio
# from your speakers or headset as "Others", in %LOCALAPPDATA%\briefing-reader\meetings only (the audio
# is never uploaded): the audio for 7 days, the transcript and summary for 30 days (also after you turn
# this off); Delete removes one at once. Speech to text runs on this PC (faster-whisper, model medium.en,
# about 1.5 GB, downloaded only when you click Download). A summary is written only when you ask for it
# (a second tick on the start card, or Summarise on the meeting): then the transcript and the guests'
# names go to Claude (Anthropic) through your own Claude Code (Ask Jarvis). Pick the microphone and the
# call-audio device in Settings > Meetings (otherwise the Windows defaults are followed). California and
# some other places need everyone's consent: the tick is your confirmation, not legal advice. Off here;
# turn it on for this PC with JARVIS_MEETINGS_ENABLED=true in .env.
enabled = false
device = "auto"               # writing a meeting down: "auto" (an NVIDIA GPU when it works, else the CPU) or "cpu"

[desktop]
# Jarvis on your desktop: he opens the files, apps, folders and sites you name, and (in later versions) tidies
# files, sets the volume, music, timers and screenshots, and fills forms in the apps you allow. The Dock's Desktop
# item (Ctrl+8) and the HUD key below switch his window into a small HUD over your desktop; the [hotkey] combo still
# opens the window as before. He never deletes anything for good (only the Recycle Bin, with Undo), never types a
# password, never pays and never presses Submit, Send, Pay or Delete in another app. To plan, only file names and
# window labels go to your Claude plan, never what is inside them, and logs never hold them. Off here; turn it on
# for this PC with JARVIS_DESKTOP_ENABLED=true in .env. Even then nothing works until you click Turn on on the
# "Jarvis on your desktop" card.
enabled = false
# The folders he may look in: any of "desktop", "documents", "downloads", "pictures", "music" and "videos"
# (Windows' own folders, wherever OneDrive keeps them). Code folders, AppData, the Recycle Bin and files that look
# like keys or passwords are always left out.
folders = ["desktop", "documents", "downloads", "pictures", "music", "videos"]
extra_folders = []            # more folders, each a full path under your user folder
hide_from_capture = true      # leave the HUD out of screenshots and screen sharing
screenshots_dir = ""          # where screenshots go; "" = the Jarvis\Screenshots folder in your user folder
undo_days = 7                 # how long Undo is offered, in days (1..30)
hud_key = "ctrl+alt+h"        # switches between the window and the HUD; never the [hotkey] combo
apps = false                  # work inside the apps you allow (filling forms): a later version, and off until then

[agent]
# Jarvis, a true agent: give him a task and he works out the steps himself - he shows a plan, works through it with
# his own tools, checks what he did and reports what he produced and what he could not do. Your own Claude Code does
# the thinking on your claude.ai plan, over tools only Jarvis serves on this PC. He writes only inside his workspace
# (text-like files, never a program or a script); anything else waits for your click, as ever. When a task needs them
# he reads what "private" below allows: never to send, and once he has read a mail or a file, whatever he would search
# for outside your own words asks you first. Off here; turn it on for this PC with JARVIS_AGENT_ENABLED=true in .env.
# It also needs [desktop] and [ask] on.
enabled = false
model = "opus"                # the tasks' model; quick replies stay on [ask] model
effort = ""                   # "low", "medium", "high", "xhigh" or "max"; "" = Claude Code's default
max_turns = 60                # a task's budget; reaching it asks "Keep going?" (5..1000)
max_minutes = 20              # ... and so does this many minutes of work (1..240)
tasks_per_day = 20            # how many tasks may start in 24 hours (1..200)
search_engine = "duckduckgo"  # where his searches go: "duckduckgo", "bing" or "google" (the words of each search go there)
workspace = ""                # his files; "" = the Jarvis\Workspace folder in your user folder; never under OneDrive
private = ["calendar", "contacts", "memory", "mail", "files"]   # what a task may read of your things, when it needs them
speak_private = false         # true: a line that may hold something private is said aloud too (spoken lines go to Microsoft's online voice)

[talk]
# Talk to Jarvis: tap the talk key, say what you want, and he takes it after about half a second of quiet (tap
# again to end sooner, Esc to cancel). He hears you only between the tap and the end, and he shows that he is
# listening the whole time. Your speech is turned into text on this PC by a speech model downloaded only when you
# click Download, and the sound is never saved; what he heard goes in as if you had typed it, so cards still need
# your click: voice never approves or undoes anything. It needs the Python add-ons faster-whisper and PyAudioWPatch
# (you install them; Jarvis never does). Off here; turn it on for this PC with JARVIS_TALK_ENABLED=true in .env, then
# restart the "Briefing hotkey" task.
enabled = false
key = "ctrl+alt+space"        # the talk key; never the [hotkey] combo or the [desktop] hud_key
model = "small.en"            # "small.en" (about 480 MB), "base.en" (145 MB, quicker, less sure), "medium.en" (1.5 GB, the meetings' model) or "distil-large-v3" (1.5 GB, the most accurate: best on an NVIDIA GPU)
device = "auto"               # "auto": an NVIDIA GPU when it works (README "Speech on an NVIDIA GPU"), else the CPU; "cpu": never the GPU
keep_warm_minutes = 10        # the speech model stays loaded this long after a talk, so the next starts at once (1..120)
quiet_ms = 500                # this much quiet after you speak ends a talk, in milliseconds (300..2000)
hints = []                    # names he should expect to hear, e.g. ["Spotify", "Notion"] ("Jarvis" always is)

[instant]
# Instant answers: everyday questions Jarvis answers himself, typed or spoken, in well under a second and without
# your Claude plan - the time and date (also in another city), dates ("days until Christmas"), sums and percentages,
# unit conversions and timers. Those never leave this PC. Anything he can't answer for sure goes to Claude exactly
# as before. The weather sends only a town's name to Open-Meteo, and currencies only the two currency codes to
# Frankfurter (the European Central Bank's daily rates); if either can't be reached, the question goes to Claude.
# Set enabled = false to send everything to Claude (JARVIS_INSTANT_ENABLED in .env overrides it).
enabled = true
weather = true                # "what's the weather in Paris", "will it rain tomorrow"
currency = true               # "100 dollars in euros"
town = ""                     # the weather's town when you name none, e.g. "Oslo" (kept on this PC; sent only to Open-Meteo)
temperature = "auto"          # "auto" (the Windows region: the US gets Fahrenheit), "celsius" or "fahrenheit"
calendar = true               # "what's my next meeting", "am I free at 3": from your calendars; titles shown, never said
